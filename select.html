
<!DOCTYPE html>
<html>

<head>
  <title>Pickwento</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Trebuchet MS', sans-serif;
      min-height: 100vh;
      background-color: #3C6D71;
    }

    .background-image {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      z-index: -1;
    }

    .logo {
      font-family: 'Comic Sans MS', cursive;
      font-size: 36px;
      font-weight: bold;
      color: #3C6D71;
    }

    .logo-div {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 15px;
      text-align: center;
    }

    .image-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 25px;
      min-height: calc(100vh - 50px);
      padding: 30px 15px 70px;
      background-color: rgba(60, 109, 113, 0.3);
    }

    .image-container a {
      display: block;
      width: 100%;
      max-width: 650px;
      padding: 40px 0;
    }

    .image-container img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      border: 5px solid #3C6D71;
      border-radius: 12px;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .image-container img:hover {
      transform: scale(1.03);
      border-color: #BEEF62;
    }

    .footer-div {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background-color: rgba(240, 240, 240, 0.9);
      padding: 10px;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <img class="background-image" src="images/front.jpg" alt="">

  <div class="image-container">
    <a href="pages/1.html"><img src="images/books/1/cover.jpg" alt="Week 1"></a>
    <a href="pages/2.html"><img src="images/books/2/cover.jpg" alt="Week 2"></a>
    <a href="pages/3.html"><img src="images/books/3/cover.jpg" alt="Week 3"></a>
    <a href="pages/4.html"><img src="images/books/4/cover.jpg" alt="Week 4"></a>
    <a href="pages/5.html"><img src="images/books/5/cover.jpg" alt="Week 5"></a>
    <a href="pages/6.html"><img src="images/books/6/cover.jpg" alt="Week 6"></a>
  </div>

  <div class="footer-div">
    by Diana V. Facun
  </div>

</body>

</html>
