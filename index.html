<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PicKwento</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100dvh;
      background-color: #5DB6BC;
    }

    .splash-screen {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fff;
      animation: fadeIn 1.5s ease forwards;
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="splash-screen">
    <img src="images/front.jpg" alt="Logo" class="logo">
  </div>

  <script>
    setTimeout(function () {
      window.location.href = "select.html";
    }, 2500); 
  </script>
</body>

</html>
